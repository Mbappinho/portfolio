<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Redirection…</title>
    <!--
      Fallback SPA pour GitHub Pages (variante rafgraph/spa-github-pages).
      GitHub Pages sert ce fichier pour toute route inexistante
      (ex. /portfolio/profil). On conserve le segment de base (/portfolio/)
      et on encode le reste du chemin dans la query "?/", restaurée ensuite
      par le script présent dans index.html.
    -->
    <script type="text/javascript">
      // Nombre de segments de chemin à conserver dans l'URL de redirection :
      // 1 pour un site déployé sous /<repo>/, 0 pour la racine du domaine.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
