<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Revue personnelle de Théo Bourgeois : communication, développement et projets numériques." />
    <meta name="theme-color" content="#F3EEE3" />
    <!-- Restauration de route SPA (GitHub Pages) : si l'URL contient la
         query "?/" générée par public/404.html, on reconstruit la vraie
         route via history.replaceState avant le démarrage de React.
         Sans "?/" (preview à la racine, navigation normale), ce script
         ne fait rien. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <meta property="og:title" content="Théo Bourgeois · Édition N°1 · Revue personnelle" />
    <meta property="og:description" content="Revue personnelle de Théo Bourgeois : communication, développement et projets numériques." />
    <meta property="og:type" content="website" />
    <title>Théo Bourgeois · Édition N°1 · Revue personnelle</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;0,900;1,900&family=Archivo:wght@500;700;800&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
